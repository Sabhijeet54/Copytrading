# Local development infrastructure only (PostgreSQL + Redis).
# The API, worker and web app run on your machine with `npm run dev` / `npm run worker`.
services:
  postgres:
    image: postgres:16-alpine
    container_name: ctp-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ctp
      POSTGRES_PASSWORD: ctp_dev_password
      POSTGRES_DB: copy_trading
    ports:
      - "5432:5432"
    volumes:
      - ctp_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ctp -d copy_trading"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: ctp-redis
    restart: unless-stopped
    # AOF persistence so BullMQ jobs survive a Redis restart.
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    ports:
      - "6379:6379"
    volumes:
      - ctp_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  ctp_pg_data:
  ctp_redis_data:
